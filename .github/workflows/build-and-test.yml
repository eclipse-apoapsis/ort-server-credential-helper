# Commitlint configuration.
# See: https://github.com/conventional-changelog/commitlint/blob/master/docs/reference/rules.md
---
name: Build and Test

on:
  merge_group:
    types: [ checks_requested ]
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Run tests
        run: ./gradlew --scan allTests

      - name: Create Test Summary
        uses: test-summary/action@31493c76ec9e7aa675f1585d3ed6f1da69269a86 # v2.4
        with:
          paths: "**/test-results/**/TEST-*.xml"
        if: success() || failure()

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success() || failure()
        with:
          name: test-results
          path: "**/build/reports/tests"
          retention-days: 7

  build-native:
    needs: test
    strategy:
      matrix:
        target:
          - name: 'Linux x64'
            os: ubuntu-24.04
            gradleSuffix: 'LinuxX64'
            platform: 'linux-x64'
            binDir: 'linuxX64'
            binExt: '.kexe'
          - name: 'Linux arm64'
            os: ubuntu-24.04
            gradleSuffix: 'LinuxArm64'
            platform: 'linux-arm64'
            binDir: 'linuxArm64'
            binExt: '.kexe'
          - name: 'macOS arm64'
            os: macos-26
            gradleSuffix: 'MacosArm64'
            platform: 'macos-arm64'
            binDir: 'macosArm64'
            binExt: '.kexe'
          - name: 'Windows x64'
            os: windows-2025
            gradleSuffix: 'MingwX64'
            platform: 'windows-x64'
            binDir: 'mingwX64'
            binExt: '.exe'

    name: Build ${{ matrix.target.name }} native binaries
    runs-on: ${{ matrix.target.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        if: runner.os == 'Windows'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Get the Kotlin version
        id: get-kotlin-plugin-info
        shell: bash
        run: echo "info=$(./gradlew -q :git:properties | grep kotlin.plugin.loaded.in.projects)" >> $GITHUB_OUTPUT

      - name: Cache the .konan directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: ${{ steps.get-kotlin-plugin-info.outputs.info }}

      - name: Build native binaries - ${{ matrix.target.name }}
        run: >
          ./gradlew --stacktrace
          git:linkReleaseExecutable${{ matrix.target.gradleSuffix }}
          bazel:linkReleaseExecutable${{ matrix.target.gradleSuffix }}

      - name: Stage git credential helper binary
        shell: bash
        run: |
          mkdir -p git-credential-helper-${{ matrix.target.platform }}
          mv git/build/bin/${{ matrix.target.binDir }}/releaseExecutable/credentialhelper${{ matrix.target.binExt }} \
             git-credential-helper-${{ matrix.target.platform }}/credentialhelper${{ matrix.target.binExt }}

      - name: Stage Bazel credential helper binary
        shell: bash
        run: |
          mkdir -p bazel-credential-helper-${{ matrix.target.platform }}
          mv bazel/build/bin/${{ matrix.target.binDir }}/releaseExecutable/credentialhelper${{ matrix.target.binExt }} \
             bazel-credential-helper-${{ matrix.target.platform }}/credentialhelper${{ matrix.target.binExt }}

      - name: Upload Git credential helper binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: git-credential-helper-${{ matrix.target.platform }}
          path: git-credential-helper-${{ matrix.target.platform }}/credentialhelper${{ matrix.target.binExt }}
          retention-days: 7

      - name: Upload Bazel credential helper binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bazel-credential-helper-${{ matrix.target.platform }}
          path: bazel-credential-helper-${{ matrix.target.platform }}/credentialhelper${{ matrix.target.binExt }}
          retention-days: 7

  smoke-test-native:
    needs: [build-native]
    strategy:
      matrix:
        target:
          - name: 'Linux x64'
            os: ubuntu-24.04
            platform: 'linux-x64'
            binExt: '.kexe'
          - name: 'Linux arm64'
            os: ubuntu-24.04-arm
            platform: 'linux-arm64'
            binExt: '.kexe'
          - name: 'macOS arm64'
            os: macos-26
            platform: 'macos-arm64'
            binExt: '.kexe'
          - name: 'Windows x64'
            os: windows-2025
            platform: 'windows-x64'
            binExt: '.exe'

    name: Smoke test ${{ matrix.target.name }} native binaries
    runs-on: ${{ matrix.target.os }}
    steps:
      - name: Download Git credential helper binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: git-credential-helper-${{ matrix.target.platform }}
          path: git-credential-helper-${{ matrix.target.platform }}

      - name: Download Bazel credential helper binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bazel-credential-helper-${{ matrix.target.platform }}
          path: bazel-credential-helper-${{ matrix.target.platform }}

      - name: Make binaries executable
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x git-credential-helper-${{ matrix.target.platform }}/credentialhelper${{ matrix.target.binExt }}
          chmod +x bazel-credential-helper-${{ matrix.target.platform }}/credentialhelper${{ matrix.target.binExt }}

      - name: Run Git credential helper
        shell: bash
        run: |
          printf 'https://user:pass@github.com' > ~/.git-credentials
          output=$(printf 'protocol=https\nhost=github.com' | \
            ./git-credential-helper-${{ matrix.target.platform }}/credentialhelper${{ matrix.target.binExt }} get)
          echo "$output" | grep -q 'username=user' || { echo "Missing username in output"; exit 1; }
          echo "$output" | grep -q 'password=pass' || { echo "Missing password in output"; exit 1; }

      - name: Run Bazel credential helper
        shell: bash
        run: |
          printf 'https://user:pass@registry.example.com' > ~/.bazel-credentials
          output=$(printf '{"uri":"https://registry.example.com"}' | \
            ./bazel-credential-helper-${{ matrix.target.platform }}/credentialhelper${{ matrix.target.binExt }} get)
          # base64("user:pass") = dXNlcjpwYXNz
          echo "$output" | grep -q 'dXNlcjpwYXNz' || { echo "Missing Basic auth token in output"; exit 1; }
