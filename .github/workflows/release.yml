---
name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-RC[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to release from"
        required: true
        type: string

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  VERSION: ${{ inputs.tag || github.ref_name }}

jobs:
  build-native:
    strategy:
      matrix:
        target:
          - name: 'Linux x64'
            os: ubuntu-24.04
            gradleSuffix: 'LinuxX64'
            platform: 'linux-x64'
            binDir: 'linuxX64'
            binExt: '.kexe'
            archiveExt: 'tar.gz'
          - name: 'Linux arm64'
            os: ubuntu-24.04
            gradleSuffix: 'LinuxArm64'
            platform: 'linux-arm64'
            binDir: 'linuxArm64'
            binExt: '.kexe'
            archiveExt: 'tar.gz'
          - name: 'macOS arm64'
            os: macos-26
            gradleSuffix: 'MacosArm64'
            platform: 'macos-arm64'
            binDir: 'macosArm64'
            binExt: '.kexe'
            archiveExt: 'tar.gz'
          - name: 'Windows x64'
            os: windows-2025
            gradleSuffix: 'MingwX64'
            platform: 'windows-x64'
            binDir: 'mingwX64'
            binExt: '.exe'
            archiveExt: 'zip'

    name: Build ${{ matrix.target.name }} native binaries
    runs-on: ${{ matrix.target.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.VERSION }}
          fetch-depth: 0

      - name: Setup Java
        if: runner.os == 'Windows'
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: Get the Kotlin version
        id: get-kotlin-plugin-info
        shell: bash
        run: echo "info=$(./gradlew -q :git:properties | grep kotlin.plugin.loaded.in.projects)" >> $GITHUB_OUTPUT

      - name: Cache the .konan directory
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.konan
          key: ${{ steps.get-kotlin-plugin-info.outputs.info }}

      - name: Build native binaries - ${{ matrix.target.name }}
        run: >
          ./gradlew --stacktrace
          git:linkReleaseExecutable${{ matrix.target.gradleSuffix }}
          bazel:linkReleaseExecutable${{ matrix.target.gradleSuffix }}

      - name: Stage git credential helper binary
        shell: bash
        run: |
          mkdir -p git-credential-helper-${{ matrix.target.platform }}
          mv git/build/bin/${{ matrix.target.binDir }}/releaseExecutable/credentialhelper${{ matrix.target.binExt }} \
             git-credential-helper-${{ matrix.target.platform }}/credentialhelper${{ matrix.target.binExt }}

      - name: Stage Bazel credential helper binary
        shell: bash
        run: |
          mkdir -p bazel-credential-helper-${{ matrix.target.platform }}
          mv bazel/build/bin/${{ matrix.target.binDir }}/releaseExecutable/credentialhelper${{ matrix.target.binExt }} \
             bazel-credential-helper-${{ matrix.target.platform }}/credentialhelper${{ matrix.target.binExt }}


      - name: Compress git credential helper binary
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            powershell Compress-Archive \
              -Path git-credential-helper-${{ matrix.target.platform }}/credentialhelper${{ matrix.target.binExt }} \
              -DestinationPath git-credential-helper-${{ matrix.target.platform }}.${{ matrix.target.archiveExt }}
          else
            tar -czf git-credential-helper-${{ matrix.target.platform }}.${{ matrix.target.archiveExt }} \
              -C git-credential-helper-${{ matrix.target.platform }} \
              credentialhelper${{ matrix.target.binExt }}
          fi

      - name: Compress Bazel credential helper binary
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            powershell Compress-Archive \
              -Path bazel-credential-helper-${{ matrix.target.platform }}/credentialhelper${{ matrix.target.binExt }} \
              -DestinationPath bazel-credential-helper-${{ matrix.target.platform }}.${{ matrix.target.archiveExt }}
          else
            tar -czf bazel-credential-helper-${{ matrix.target.platform }}.${{ matrix.target.archiveExt }} \
              -C bazel-credential-helper-${{ matrix.target.platform }} \
              credentialhelper${{ matrix.target.binExt }}
          fi

      - name: Upload git credential helper archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: git-credential-helper-${{ matrix.target.platform }}
          path: git-credential-helper-${{ matrix.target.platform }}.${{ matrix.target.archiveExt }}
          retention-days: 7

      - name: Upload Bazel credential helper archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bazel-credential-helper-${{ matrix.target.platform }}
          path: bazel-credential-helper-${{ matrix.target.platform }}.${{ matrix.target.archiveExt }}
          retention-days: 7

  smoke-test-native:
    needs: [build-native]
    strategy:
      matrix:
        target:
          - name: 'Linux x64'
            os: ubuntu-24.04
            platform: 'linux-x64'
            binExt: '.kexe'
            archiveExt: 'tar.gz'
          - name: 'Linux arm64'
            os: ubuntu-24.04-arm
            platform: 'linux-arm64'
            binExt: '.kexe'
            archiveExt: 'tar.gz'
          - name: 'macOS arm64'
            os: macos-26
            platform: 'macos-arm64'
            binExt: '.kexe'
            archiveExt: 'tar.gz'
          - name: 'Windows x64'
            os: windows-2025
            platform: 'windows-x64'
            binExt: '.exe'
            archiveExt: 'zip'

    name: Smoke test ${{ matrix.target.name }} native binaries
    runs-on: ${{ matrix.target.os }}
    steps:
      - name: Download git credential helper archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: git-credential-helper-${{ matrix.target.platform }}
          path: artifacts/git-credential-helper-${{ matrix.target.platform }}

      - name: Download Bazel credential helper archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bazel-credential-helper-${{ matrix.target.platform }}
          path: artifacts/bazel-credential-helper-${{ matrix.target.platform }}

      - name: Extract git credential helper binary
        shell: bash
        run: |
          mkdir -p git-credential-helper-${{ matrix.target.platform }}
          if [ "$RUNNER_OS" == "Windows" ]; then
            powershell Expand-Archive \
              -Path artifacts/git-credential-helper-${{ matrix.target.platform }}/git-credential-helper-${{ matrix.target.platform }}.${{ matrix.target.archiveExt }} \
              -DestinationPath git-credential-helper-${{ matrix.target.platform }}
          else
            tar -xzf artifacts/git-credential-helper-${{ matrix.target.platform }}/git-credential-helper-${{ matrix.target.platform }}.${{ matrix.target.archiveExt }} \
              -C git-credential-helper-${{ matrix.target.platform }}
          fi

      - name: Extract Bazel credential helper binary
        shell: bash
        run: |
          mkdir -p bazel-credential-helper-${{ matrix.target.platform }}
          if [ "$RUNNER_OS" == "Windows" ]; then
            powershell Expand-Archive \
              -Path artifacts/bazel-credential-helper-${{ matrix.target.platform }}/bazel-credential-helper-${{ matrix.target.platform }}.${{ matrix.target.archiveExt }} \
              -DestinationPath bazel-credential-helper-${{ matrix.target.platform }}
          else
            tar -xzf artifacts/bazel-credential-helper-${{ matrix.target.platform }}/bazel-credential-helper-${{ matrix.target.platform }}.${{ matrix.target.archiveExt }} \
              -C bazel-credential-helper-${{ matrix.target.platform }}
          fi

      - name: Make binaries executable
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x git-credential-helper-${{ matrix.target.platform }}/credentialhelper${{ matrix.target.binExt }}
          chmod +x bazel-credential-helper-${{ matrix.target.platform }}/credentialhelper${{ matrix.target.binExt }}

      - name: Run Git credential helper smoke test
        shell: bash
        run: |
          printf 'https://user:pass@github.com' > ~/.git-credentials
          output=$(printf 'protocol=https\nhost=github.com' | \
            ./git-credential-helper-${{ matrix.target.platform }}/credentialhelper${{ matrix.target.binExt }} get)
          echo "$output" | grep -q 'username=user' || { echo "Missing username in output"; exit 1; }
          echo "$output" | grep -q 'password=pass' || { echo "Missing password in output"; exit 1; }

      - name: Run Bazel credential helper smoke test
        shell: bash
        run: |
          printf 'https://user:pass@registry.example.com' > ~/.bazel-credentials
          output=$(printf '{"uri":"https://registry.example.com"}' | \
            ./bazel-credential-helper-${{ matrix.target.platform }}/credentialhelper${{ matrix.target.binExt }} get)
          # base64("user:pass") = dXNlcjpwYXNz
          echo "$output" | grep -q 'dXNlcjpwYXNz' || { echo "Missing Basic auth token in output"; exit 1; }

  create-release:
    needs: [smoke-test-native]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.VERSION }}
          fetch-depth: 0

      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/

      - name: Create checksums
        run: |
          shasum --algorithm 256 artifacts/*-credential-helper-*/*.{tar.gz,zip} \
            | sed 's|artifacts/[^/]*/||' > checksums.txt

      - name: Generate Release Notes
        run: ./gradlew -q printChangeLog > RELEASE_NOTES.md

      - name: Upload Release Notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          retention-days: 7

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$VERSION" =~ -RC[0-9]+ ]]; then
            PRERELEASE_ARG="--prerelease"
          fi

          gh release create "$VERSION" --notes-file RELEASE_NOTES.md $PRERELEASE_ARG \
            'artifacts/git-credential-helper-linux-x64/git-credential-helper-linux-x64.tar.gz#git-credential-helper-linux-x64' \
            'artifacts/git-credential-helper-linux-arm64/git-credential-helper-linux-arm64.tar.gz#git-credential-helper-linux-arm64' \
            'artifacts/git-credential-helper-macos-arm64/git-credential-helper-macos-arm64.tar.gz#git-credential-helper-macos-arm64' \
            'artifacts/git-credential-helper-windows-x64/git-credential-helper-windows-x64.zip#git-credential-helper-windows-x64' \
            'artifacts/bazel-credential-helper-linux-x64/bazel-credential-helper-linux-x64.tar.gz#bazel-credential-helper-linux-x64' \
            'artifacts/bazel-credential-helper-linux-arm64/bazel-credential-helper-linux-arm64.tar.gz#bazel-credential-helper-linux-arm64' \
            'artifacts/bazel-credential-helper-macos-arm64/bazel-credential-helper-macos-arm64.tar.gz#bazel-credential-helper-macos-arm64' \
            'artifacts/bazel-credential-helper-windows-x64/bazel-credential-helper-windows-x64.zip#bazel-credential-helper-windows-x64' \
            'checksums.txt#checksums'
