[versions]

# Gradle plugins
detektPlugin = "2.0.0-alpha.3"
gitSemverPlugin = "0.19.2"

# Gradle dependencies
kotest = "6.1.11"
kotlin = "2.4.0"
kotlinxSerializationJson = "1.11.0"
okio = "3.17.0"
ort = "89.2.0"
mockk = "1.14.11"
testcontainers = "2.0.5"

[libraries]
kotestAssertionsCore = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotestFrameworkEngine = { module = "io.kotest:kotest-framework-engine", version.ref = "kotest" }
kotestRunnerJunit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotlinxSerializationJson = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
kotlinxSerializationJsonOkio = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json-okio", version.ref = "kotlinxSerializationJson" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
testcontainersCore = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }

[plugins]
detekt = { id = "dev.detekt", version.ref = "detektPlugin" }
gitSemver = { id = "com.github.jmongard.git-semver-plugin", version.ref = "gitSemverPlugin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinxSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
